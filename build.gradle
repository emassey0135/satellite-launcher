plugins {
    id 'com.android.application' version '9.4.1'
}

// Release builds are signed with the key described in keystore.properties (not committed), when it exists:
// storeFile, storePassword, keyAlias, keyPassword. GitHub Actions writes it from the repository's secrets.
def keystoreFile = rootProject.file('keystore.properties')
def keystore = new Properties()
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystore.load(it) }
}

android {
    namespace = 'dev.emassey0135.satellite.launcher'
    compileSdk = 37

    defaultConfig {
        applicationId = 'dev.emassey0135.satellite.launcher'
        minSdk = 30
        // The Orbit Speak and Orbit Player run Android 11.
        targetSdk = 30
        // GitHub Actions gives each build the number of commits as its version code, so that every build is newer than
        // the ones before it, and adds -dev.N to the name of builds that aren't releases.
        versionCode = (findProperty('versionCode') ?: '1') as int
        versionName = '0.1.0' + (findProperty('versionSuffix') ?: '')
    }

    buildFeatures {
        aidl = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile = rootProject.file(keystore['storeFile'])
                storePassword = keystore['storePassword']
                keyAlias = keystore['keyAlias']
                keyPassword = keystore['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            if (keystoreFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
    }

    lint {
        // targetSdk stays at Android 11, the version the Orbit devices run; this isn't a Play Store app.
        disable 'ExpiredTargetSdkVersion', 'OldTargetApi'
    }

    testOptions {
        // The model and T9 input use Android classes only in passing (a Handler, a file, the log), which then do nothing.
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // android.jar's org.json is only stubs, and the menu's tests read and write real JSON.
    testImplementation 'org.json:json:20260814'
}
